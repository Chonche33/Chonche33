<!DOCTYPE html>
<html>
  <head>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h4 id="plugin-heading">Tag-Master</h4>
    <div class="main-div">
      <!-- Section pour les tags -->
      <div class="tag-section">
        <div class="input-group">
          <input type="text" id="tagText" placeholder="Texte du tag" />
          <select id="tagColor">
            <option value="#FF0000">Rouge</option>
            <option value="#00FF00">Vert</option>
            <option value="#0000FF">Bleu</option>
            <option value="#FFFF00">Jaune</option>
            <option value="#FF00FF">Magenta</option>
            <option value="#00FFFF">Cyan</option>
            <option value="#FFA500">Orange</option>
            <option value="#800080">Violet</option>
            <option value="#A52A2A">Marron</option>
            <option value="#808080">Gris</option>
          </select>
          <button id="addTagBtn">Ajouter le tag</button>
        </div>
        <div id="tagsContainer" class="tags-container"></div>
      </div>

      <!-- Section pour les logs et infos du projet -->
      <div id="plugin-body"></div>
    </div>
    <footer>
      <button id="btnPopulate">Populate Application Info</button>
      <button id="clear-btn">Clear Application Info</button>
    </footer>
  </body>
</html>
